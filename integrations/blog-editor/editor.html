<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog editor</title>
    <script>
      // Same preference the blog stores, so editor and preview match.
      try {
        const saved = localStorage.getItem('color-mode')
        const dark = saved
          ? saved === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      :root {
        --bg: #fff;
        --bg-soft: #f6f7f9;
        --text: #24292f;
        --muted: #6a737d;
        --border: #e1e4e8;
        --accent: #4282b8;
        --ok: #1a7f37;
        --error: #cf222e;
        --warn-bg: #fff8c5;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #181a1b;
        --bg-soft: #1f2223;
        --text: #e8e6e3;
        --muted: #9aa0a6;
        --border: #363b3d;
        --accent: #6aa6d8;
        --ok: #3fb950;
        --error: #f85149;
        --warn-bg: #3b2e00;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--accent);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      .button {
        display: inline-block;
        text-decoration: none;
        color: var(--text);
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary,
      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      [hidden] {
        display: none !important;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        min-height: 48px;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tool {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--text);
      }
      .tool:hover:not(:disabled) {
        background: var(--bg-soft);
      }
      .tool:disabled {
        background: none;
      }
      .tool svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .separator {
        width: 1px;
        height: 20px;
        margin: 0 6px;
        background: var(--border);
      }
      #open-link {
        margin-left: auto;
        white-space: nowrap;
      }
      #status {
        color: var(--muted);
        white-space: nowrap;
      }
      #status[data-state='saved'] {
        color: var(--ok);
      }
      #status[data-state='error'] {
        color: var(--error);
      }

      #conflict {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: var(--warn-bg);
        border-bottom: 1px solid var(--border);
      }
      #conflict p {
        margin: 0;
        flex: 1;
      }

      main {
        flex: 1;
        min-height: 0;
      }
      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px;
        overflow: auto;
        height: 100%;
      }

      #posts {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }
      #posts a {
        display: flex;
        gap: 12px;
        align-items: baseline;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
        color: var(--text);
      }
      #posts a:hover {
        background: var(--bg-soft);
      }
      #posts strong {
        flex: 1;
      }
      #posts small {
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 8px;
        color: var(--muted);
      }

      form label {
        display: block;
        margin-top: 14px;
        font-weight: 600;
      }
      form small {
        font-weight: normal;
        color: var(--muted);
      }
      form input,
      form textarea,
      form select {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row select {
        flex: 1;
      }
      #cover-preview {
        display: block;
        max-width: 100%;
        max-height: 160px;
        margin-top: 8px;
        border-radius: 6px;
      }
      .error {
        color: var(--error);
      }
      .actions {
        margin-top: 20px;
        display: flex;
        gap: 8px;
      }

      #editor-view {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100%;
      }
      #source {
        min-width: 0;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      #source .cm-editor {
        height: 100%;
      }
      #source .cm-scroller {
        font-size: 13px;
      }
      #preview {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }
      @media (max-width: 800px) {
        #editor-view {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
        #source {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }

      dialog {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        width: min(420px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 40%);
      }
    </style>
  </head>
  <body data-images="%IMAGES%">
    <header>
      <a
        href="/__editor/"
        id="home-link"
        class="tool"
        title="All posts"
        aria-label="All posts"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M7.82843 10.9999H20V12.9999H7.82843L13.1924 18.3638L11.7782 19.778L4 11.9999L11.7782 4.22168L13.1924 5.63589L7.82843 10.9999Z"
          />
        </svg>
      </a>
      <h1 id="heading">Blog editor</h1>
      <div id="toolbar" role="toolbar" aria-label="Formatting" hidden>
        <button
          type="button"
          class="tool"
          data-command="bold"
          title="Bold (Ctrl+B)"
          aria-label="Bold"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M8 11H12.5C13.8807 11 15 9.88071 15 8.5C15 7.11929 13.8807 6 12.5 6H8V11ZM18 15.5C18 17.9853 15.9853 20 13.5 20H6V4H12.5C14.9853 4 17 6.01472 17 8.5C17 9.70431 16.5269 10.7981 15.7564 11.6058C17.0979 12.3847 18 13.837 18 15.5ZM8 13V18H13.5C14.8807 18 16 16.8807 16 15.5C16 14.1193 14.8807 13 13.5 13H8Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="italic"
          title="Italic (Ctrl+I)"
          aria-label="Italic"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 20H7V18H9.92661L12.0425 6H9V4H17V6H14.0734L11.9575 18H15V20Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="quote"
          title="Quote"
          aria-label="Quote"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4.58341 17.3211C3.55316 16.2274 3 15 3 13.0103C3 9.51086 5.45651 6.37366 9.03059 4.82318L9.92328 6.20079C6.58804 8.00539 5.93618 10.346 5.67564 11.822C6.21263 11.5443 6.91558 11.4466 7.60471 11.5105C9.40908 11.6778 10.8312 13.159 10.8312 15C10.8312 16.933 9.26416 18.5 7.33116 18.5C6.2581 18.5 5.23196 18.0095 4.58341 17.3211ZM14.5834 17.3211C13.5532 16.2274 13 15 13 13.0103C13 9.51086 15.4565 6.37366 19.0306 4.82318L19.9233 6.20079C16.588 8.00539 15.9362 10.346 15.6756 11.822C16.2126 11.5443 16.9156 11.4466 17.6047 11.5105C19.4091 11.6778 20.8312 13.159 20.8312 15C20.8312 16.933 19.2642 18.5 17.3312 18.5C16.2581 18.5 15.232 18.0095 14.5834 17.3211Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="codeBlock"
          title="Code block"
          aria-label="Code block"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3.41436 5.99995L5.70726 3.70706L4.29304 2.29285L0.585938 5.99995L4.29304 9.70706L5.70726 8.29285L3.41436 5.99995ZM9.58594 5.99995L7.29304 3.70706L8.70726 2.29285L12.4144 5.99995L8.70726 9.70706L7.29304 8.29285L9.58594 5.99995ZM14.0002 2.99995H21.0002C21.5524 2.99995 22.0002 3.44767 22.0002 3.99995V20C22.0002 20.5522 21.5524 21 21.0002 21H3.00015C2.44787 21 2.00015 20.5522 2.00015 20V12H4.00015V19H20.0002V4.99995H14.0002V2.99995Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="bullet"
          title="Bulleted list"
          aria-label="Bulleted list"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M8 4H21V6H8V4ZM4.5 6.5C3.67157 6.5 3 5.82843 3 5C3 4.17157 3.67157 3.5 4.5 3.5C5.32843 3.5 6 4.17157 6 5C6 5.82843 5.32843 6.5 4.5 6.5ZM4.5 13.5C3.67157 13.5 3 12.8284 3 12C3 11.1716 3.67157 10.5 4.5 10.5C5.32843 10.5 6 11.1716 6 12C6 12.8284 5.32843 13.5 4.5 13.5ZM4.5 20.4C3.67157 20.4 3 19.7284 3 18.9C3 18.0716 3.67157 17.4 4.5 17.4C5.32843 17.4 6 18.0716 6 18.9C6 19.7284 5.32843 20.4 4.5 20.4ZM8 11H21V13H8V11ZM8 18H21V20H8V18Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="ordered"
          title="Numbered list"
          aria-label="Numbered list"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M5.75024 3.5H4.71733L3.25 3.89317V5.44582L4.25002 5.17782L4.25018 8.5H3V10H7V8.5H5.75024V3.5ZM10 4H21V6H10V4ZM10 11H21V13H10V11ZM10 18H21V20H10V18ZM2.875 15.625C2.875 14.4514 3.82639 13.5 5 13.5C6.17361 13.5 7.125 14.4514 7.125 15.625C7.125 16.1106 6.96183 16.5587 6.68747 16.9167L6.68271 16.9229L5.31587 18.5H7V20H3.00012L2.99959 18.8786L5.4717 16.035C5.5673 15.9252 5.625 15.7821 5.625 15.625C5.625 15.2798 5.34518 15 5 15C4.67378 15 4.40573 15.2501 4.37747 15.5688L4.3651 15.875H2.875V15.625Z"
            />
          </svg>
        </button>
        <span class="separator" aria-hidden="true"></span>
        <button
          type="button"
          class="tool"
          data-command="undo"
          title="Undo (Ctrl+Z)"
          aria-label="Undo"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M5.82843 6.99955L8.36396 9.53509L6.94975 10.9493L2 5.99955L6.94975 1.0498L8.36396 2.46402L5.82843 4.99955H13C17.4183 4.99955 21 8.58127 21 12.9996C21 17.4178 17.4183 20.9996 13 20.9996H4V18.9996H13C16.3137 18.9996 19 16.3133 19 12.9996C19 9.68584 16.3137 6.99955 13 6.99955H5.82843Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="tool"
          data-command="redo"
          title="Redo (Ctrl+Shift+Z)"
          aria-label="Redo"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.1716 6.99955H11C7.68629 6.99955 5 9.68584 5 12.9996C5 16.3133 7.68629 18.9996 11 18.9996H20V20.9996H11C6.58172 20.9996 3 17.4178 3 12.9996C3 8.58127 6.58172 4.99955 11 4.99955H18.1716L15.636 2.46402L17.0503 1.0498L22 5.99955L17.0503 10.9493L15.636 9.53509L18.1716 6.99955Z"
            />
          </svg>
        </button>
      </div>
      <span id="status" aria-live="polite"></span>
      <a id="open-link" target="_blank" hidden>Open page ↗</a>
    </header>

    <div id="conflict" role="alert" hidden>
      <p>
        This file changed on disk since you opened it. Your latest edits weren't
        saved.
      </p>
      <button type="button" id="conflict-reload">
        Reload (use the disk version)
      </button>
      <button type="button" id="conflict-overwrite">
        Overwrite (keep mine)
      </button>
    </div>

    <main>
      <section id="list-view" class="page" hidden>
        <div class="row">
          <h2 style="flex: 1; margin: 0">Posts</h2>
          <a href="/__editor/?new" class="button primary">New post</a>
        </div>
        <ul id="posts"></ul>
      </section>

      <section id="new-view" class="page" hidden>
        <h2 style="margin: 0">New post</h2>
        <form id="new-form" novalidate>
          <label>
            Title
            <input name="title" required autocomplete="off" />
          </label>
          <label>
            Slug <small>(the URL: /blog/&lt;slug&gt;/)</small>
            <input
              name="slug"
              required
              pattern="[a-z0-9]+(-[a-z0-9]+)*"
              autocomplete="off"
            />
          </label>
          <label>
            Description
            <textarea name="description" rows="2" required></textarea>
          </label>
          <label>
            Category
            <input
              name="category"
              list="categories"
              required
              autocomplete="off"
            />
            <datalist id="categories"></datalist>
          </label>
          <label>
            Tags <small>(comma separated)</small>
            <input name="tags" autocomplete="off" />
          </label>
          <label for="cover-select">Cover</label>
          <div class="row">
            <select id="cover-select" name="cover" required></select>
            <button type="button" id="cover-upload">Upload…</button>
            <input
              type="file"
              id="cover-file"
              accept=".png,.jpg,.jpeg,.webp,.avif"
              hidden
            />
          </div>
          <img id="cover-preview" alt="" hidden />
          <p id="new-error" class="error" role="alert"></p>
          <div class="actions">
            <button type="submit" class="primary">Create draft</button>
            <a href="/__editor/" class="button">Cancel</a>
          </div>
        </form>
      </section>

      <section id="editor-view" hidden>
        <div id="source"></div>
        <iframe id="preview" title="Preview"></iframe>
      </section>
    </main>

    <dialog id="image-dialog">
      <form method="dialog" id="image-form">
        <label>
          Image name
          <input name="name" required autocomplete="off" />
        </label>
        <p id="image-error" class="error" role="alert"></p>
        <div class="actions">
          <button type="submit" class="primary" value="save">Save image</button>
          <button type="submit" value="cancel" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="%CLIENT%"></script>
  </body>
</html>
