<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2a86"/>
      <stop offset="1" stop-color="#e0568a"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#ff7e5f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="200" cy="860" r="300" fill="#fff" opacity=".07"/>
  <rect x="160" y="120" width="1280" height="760" rx="24" fill="#fff"/>
  <rect x="160" y="120" width="1280" height="70" rx="24" fill="#f3eef8"/>
  <rect x="160" y="166" width="1280" height="24" fill="#f3eef8"/>
  <circle cx="206" cy="155" r="9" fill="#ff5f57"/>
  <circle cx="236" cy="155" r="9" fill="#febc2e"/>
  <circle cx="266" cy="155" r="9" fill="#28c840"/>
  <!-- slide thumbnails -->
  <rect x="160" y="190" width="240" height="690" fill="#faf7fd"/>
  <rect x="190" y="220" width="180" height="110" rx="10" fill="url(#art)"/>
  <rect x="190" y="350" width="180" height="110" rx="10" fill="#e9dff5" stroke="#5b2a86" stroke-width="4"/>
  <rect x="190" y="480" width="180" height="110" rx="10" fill="#e9dff5"/>
  <rect x="190" y="610" width="180" height="110" rx="10" fill="#e9dff5"/>
  <!-- main slide -->
  <rect x="440" y="230" width="640" height="400" rx="16" fill="#2a1445"/>
  <circle cx="900" cy="400" r="130" fill="url(#art)" opacity=".9"/>
  <circle cx="960" cy="360" r="70" fill="#e0568a" opacity=".8"/>
  <rect x="480" y="300" width="300" height="34" rx="8" fill="#fff"/>
  <rect x="480" y="360" width="220" height="18" rx="9" fill="#fff" opacity=".5"/>
  <rect x="480" y="394" width="260" height="18" rx="9" fill="#fff" opacity=".5"/>
  <!-- prompt panel -->
  <rect x="1120" y="230" width="280" height="400" rx="16" fill="#faf7fd"/>
  <text x="1148" y="276" font-size="22" font-weight="700" fill="#5b2a86">AI assistant</text>
  <rect x="1148" y="306" width="224" height="64" rx="12" fill="#e9dff5"/>
  <rect x="1148" y="388" width="224" height="64" rx="12" fill="#e9dff5"/>
  <rect x="1148" y="540" width="224" height="52" rx="26" fill="#5b2a86"/>
  <text x="1260" y="574" font-size="22" fill="#fff" text-anchor="middle">Generate</text>
  <!-- timeline -->
  <rect x="440" y="670" width="960" height="150" rx="16" fill="#faf7fd"/>
  <rect x="470" y="700" width="200" height="90" rx="10" fill="#e0568a" opacity=".85"/>
  <rect x="690" y="700" width="260" height="90" rx="10" fill="#5b2a86" opacity=".85"/>
  <rect x="970" y="700" width="180" height="90" rx="10" fill="#ff7e5f" opacity=".85"/>
  <rect x="1170" y="700" width="200" height="90" rx="10" fill="#c5aee0"/>
</svg>
