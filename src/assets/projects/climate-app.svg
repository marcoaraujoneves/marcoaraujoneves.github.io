  <g fill="#fff" opacity=".9">
    <circle cx="260" cy="300" r="14"/><circle cx="360" cy="480" r="14"/><circle cx="220" cy="640" r="14"/>
    <circle cx="1340" cy="360" r="14"/><circle cx="1260" cy="560" r="14"/><circle cx="1380" cy="700" r="14"/>
