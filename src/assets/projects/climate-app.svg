  <text x="800" y="360" font-size="140" font-weight="700" fill="#fff" text-anchor="middle">27°</text>
  <circle cx="800" cy="440" r="36" fill="#ffd37a"/>
  <ellipse cx="830" cy="456" rx="52" ry="26" fill="#fff"/>
  <ellipse cx="786" cy="462" rx="40" ry="22" fill="#fff"/>
  <rect x="624" y="540" width="170" height="130" rx="22" fill="#fff" opacity=".18"/>
  <rect x="806" y="540" width="170" height="130" rx="22" fill="#fff" opacity=".18"/>
  <text x="650" y="590" font-size="22" fill="#cfe8ff">Humidity</text>
