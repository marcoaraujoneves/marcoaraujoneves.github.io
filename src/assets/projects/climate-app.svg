      <stop offset="0" stop-color="#0b3c6e"/>
      <stop offset="1" stop-color="#38b6ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8fe0"/>
      <stop offset="1" stop-color="#0b3c6e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1300" cy="200" r="280" fill="#fff" opacity=".07"/>
  <!-- phone -->
  <rect x="560" y="70" width="480" height="860" rx="64" fill="#07213d"/>
  <rect x="584" y="96" width="432" height="808" rx="44" fill="url(#screen)"/>
  <rect x="740" y="112" width="120" height="26" rx="13" fill="#07213d"/>
